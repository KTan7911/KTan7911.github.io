<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdfaf6">
<meta name="robots" content="noindex,nofollow">
<title>小屋</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 启动加载 ============ -->
<div class="boot" id="boot">
  <div class="bwrap">
    <div class="blogo">🏠</div>
    <div class="btxt">小屋</div>
    <div class="bspin"></div>
  </div>
</div>

<!-- ============ 登录页 ============ -->
<div class="authpage hidden" id="authpage">
  <div class="authbox">
    <div class="logo">🏠</div>
    <div class="title">小屋</div>
    <div class="slogan">只有你自己看得见 🌿</div>

    <div class="authtabs">
      <button data-m="login" class="on">登入</button>
      <button data-m="register">注册</button>
    </div>

    <div class="authform">
      <div class="frow">
        <label>邮箱</label>
        <input type="email" id="emailInput" class="field" placeholder="你的邮箱" autocomplete="username">
      </div>
      <div class="frow">
        <label>密码</label>
        <input type="password" id="pwdInput" class="field" placeholder="至少 6 位" autocomplete="current-password">
      </div>
      <div class="frow hidden" id="confirmRow">
        <label>再输一次密码</label>
        <input type="password" id="pwdInput2" class="field" placeholder="确认密码" autocomplete="new-password">
      </div>

      <button class="btn btn-primary" id="authSubmit" style="margin-top:8px">进入小屋</button>
      <div class="authmsg" id="authMsg"></div>
    </div>

    <div class="authfoot">
      所有记录只属于你，别人看不到<br>
      数据加密存储，写下去就不可修改 🌱
    </div>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div class="app hidden" id="app">

  <!-- 顶部 -->
  <div class="top">
    <div class="avatar" id="topAvatar">🌱</div>
    <div class="tinfo">
      <div class="t1" id="topTitle">我的小屋</div>
      <div class="t2" id="topSub">只有你自己看得见 🌿</div>
    </div>
    <div class="tright">
      <div class="tbtn" id="openHole" title="我的树洞">📜</div>
      <div class="tbtn" id="openProfile" title="设置">⚙️</div>
    </div>
  </div>

  <!-- 陪伴树苗 -->
  <div class="buddy" id="buddy"></div>

  <!-- 聊天流 -->
  <div class="stream" id="stream"></div>

  <!-- 输入区 -->
  <div class="composer">
    <div class="moodstrip" id="moodstrip"></div>

    <div class="recbanner" id="recBanner">
      <span class="rb-w"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="rb-t" id="recBannerTxt">正在听你说…</span>
    </div>

    <div class="inputbar">
      <button class="circlebtn togglekey" id="toggleKey" title="切换输入方式">🎤</button>
      <div class="inputwrap" id="inputWrap">
        <textarea id="msgInput" rows="1" placeholder="说点什么…"></textarea>
      </div>
      <button class="holdtalk hidden" id="holdTalk">按住 说话</button>
      <button class="circlebtn send" id="sendBtn" disabled>➤</button>
    </div>
  </div>
</div>

<!-- ============ 树洞页 ============ -->
<div class="page hidden" id="holepage">
  <div class="pagehead">
    <div class="tbtn" id="closeHole">←</div>
    <div class="ptitle">我的树洞</div>
  </div>
  <div class="pagebody">
    <div class="filters" id="holeFilters"></div>
    <div id="holeList"></div>
  </div>
</div>

<!-- ============ 设置 / 资料页 ============ -->
<div class="page hidden" id="profilepage">
  <div class="pagehead">
    <div class="tbtn" id="closeProfile">←</div>
    <div class="ptitle">我的信息</div>
    <button class="btn btn-soft" id="pfSave" style="padding:8px 16px;font-size:12.5px">保存</button>
  </div>
  <div class="pagebody">

    <!-- 树苗 + 活跃度 -->
    <div class="pfcard pf-buddy">
      <div class="pfb-art" id="pfBuddy">🌿</div>
      <div class="pfb-info">
        <div class="pfb-label">陪伴树苗</div>
        <div class="pfb-sub" id="pfBuddyLabel">安静陪着</div>
      </div>
    </div>
    <div class="pstatgrid" id="pfStats"></div>

    <!-- 头像 -->
    <div class="pfcard">
      <div class="pfsec">
        <div class="pflabel">头像</div>
        <div class="pfsublabel">选一个喜欢的形象</div>
        <div class="avgrid" id="pfAvatars"></div>
      </div>
    </div>

    <!-- 基本信息 -->
    <div class="pfcard">
      <div class="pfsec">
        <div class="pflabel">昵称</div>
        <input type="text" id="pfNick" class="field" placeholder="给自己起个名字">
      </div>
      <div class="pfsec">
        <div class="pflabel">一句话签名</div>
        <input type="text" id="pfBio" class="field" placeholder="今天想说什么">
      </div>
      <div class="pfrow2">
        <div class="pfsec">
          <div class="pflabel">生日</div>
          <input type="date" id="pfBirth" class="field">
        </div>
        <div class="pfsec">
          <div class="pflabel">性别</div>
          <select id="pfGender" class="field">
            <option value="">不设置</option>
            <option value="男">男</option>
            <option value="女">女</option>
            <option value="保密">保密</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 爱好 -->
    <div class="pfcard">
      <div class="pfsec">
        <div class="pflabel">爱好</div>
        <div class="pfsublabel">可以多选</div>
        <div class="hobbies" id="pfHobbies"></div>
      </div>
    </div>

    <!-- 账号 -->
    <div class="pfcard">
      <div class="pfsec">
        <div class="pflabel">账号</div>
        <div class="pfemail" id="pfEmail">—</div>
      </div>
    </div>

    <!-- 修改密码 -->
    <div class="pfcard">
      <div class="pfsec">
        <div class="pflabel">修改密码</div>
        <input type="password" id="pwNew" class="field" placeholder="新密码（至少 6 位）" style="margin-bottom:10px">
        <input type="password" id="pwNew2" class="field" placeholder="再输一次" style="margin-bottom:12px">
        <button class="btn btn-line" id="pwSubmit" style="width:100%" >修改密码</button>
      </div>
    </div>

    <!-- 隐私说明 -->
    <div class="pfcard pf-note">
      <div style="font-size:22px;margin-bottom:10px">🔒</div>
      <div style="font-size:13px;line-height:1.8;color:var(--ink2)">
        这些信息只有你自己看得到。<br>
        你的记录写下去就改不了也删不掉——<br>这是故意的，让每一次真实都被保留。
      </div>
    </div>

    <!-- 退出 -->
    <button class="btn btn-primary" id="logoutBtn"
      style="background:linear-gradient(135deg,#ffb3a7,#ff8fa3);margin-top:4px">退出登录</button>

    <div style="height:30px"></div>
  </div>
</div>

<!-- ============ Toast ============ -->
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/buddy.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
